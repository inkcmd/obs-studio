<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XINKX Studio · Локальные события</title>
<style>
  :root { color-scheme: dark; --cyan: #6be4ef; --indigo: #6f6af8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
  body { position:relative; font-family: "Segoe UI", "Inter", sans-serif; color: white; pointer-events: none; }
  #surface, #chat, #timer, #viewers, #frame { zoom: var(--source-scale, 1); }
  #surface { position: absolute; inset: 0; overflow: hidden; }
  .effect { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%);
    animation: enter .24s cubic-bezier(.2,1.4,.2,1) both; will-change: transform, opacity; }
  .effect.leave { animation: exit .35s ease-in both; }
  @keyframes enter { from { opacity: 0; transform: translate(-50%, -50%) scale(.78); } }
  @keyframes exit { to { opacity: 0; transform: translate(-50%, -65%) scale(.94); } }
  body[data-position="top-right"] .effect.alert { left: auto; right: 4%; top: 9%; transform: none; }
  body[data-position="top-left"] .effect.alert { left: 4%; top: 9%; transform: none; }
  body[data-position="center"] .effect.alert { left: 50%; top: 40%; }
  .alert-card { min-width: 300px; max-width: 640px; padding: 22px 30px; border: 1px solid #8be5f68c;
    border-radius: var(--source-radius,16px); background: var(--source-background,#0a1838ed);
    box-shadow: 0 14px 55px #0008, 0 0 36px #4ec9ff3a; }
  .alert-card .kind { color: var(--cyan); letter-spacing: .2em; text-transform: uppercase; font-size: 15px; font-weight: 800; }
  .alert-card .name { font-size: var(--source-font-size,clamp(26px,3vw,47px)); font-weight: 800; margin: 8px 0; word-break: break-word; }
  .alert-card .detail { font-size: 20px; color: var(--source-text,#e0e8ff); overflow-wrap: anywhere; }
  .impact { text-align: center; font-size: clamp(85px, 12vw, 230px); font-weight: 950; letter-spacing: -.07em;
    line-height: 1; font-style: italic; text-shadow: 0 4px #09112e, 0 0 25px #53dfff, 0 0 85px #3c5dfb; }
  .impact.boom { color: #ffd268; text-shadow: 0 4px #8d1720,0 0 18px #ff9d31,0 0 100px #ff4034;
    animation: shake .13s 8 alternate; }
  @keyframes shake { from { transform: translateX(-8px) rotate(-4deg); } to { transform: translateX(9px) rotate(4deg); } }
  .full { inset: 0; transform: none; }
  .full.leave { animation: fade .35s both; }
  @keyframes fade { to { opacity: 0; } }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 190px 70px #ea1534cd;
    border: 12px solid #ff384daa; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity:.35; } to { opacity:1; } }
  .vignette strong { position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
    font-size: clamp(60px,9vw,165px); font-weight: 950; text-shadow: 0 0 22px #ff2238; }
  .particles { position:absolute; inset: 0; overflow:hidden; }
  .particle { position:absolute; top:-12%; width: 12px; height: 21px; border-radius: 3px;
    animation: fall var(--fall,3s) linear var(--delay,0s) both; transform: rotate(var(--angle,0deg)); }
  .particle.gg { font-weight: 850; font-size: 27px; width:auto; height:auto; color:var(--cyan);
    filter:drop-shadow(0 0 8px #35aafc); }
  @keyframes fall { to { top: 110%; transform: translateX(var(--drift,0px)) rotate(750deg); opacity:.2; } }
  #timer { position:absolute; top: 5%; left:50%; transform:translateX(-50%); padding: 12px 28px;
    border:1px solid #a0eeff7a; border-radius:12px; background:#08142fcc;
    box-shadow:0 10px 36px #0008, 0 0 28px #5a92e53d; color:var(--cyan);
    font-size:clamp(40px,4.5vw,84px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.04em;
    transition:opacity .35s,transform .35s; }
  #timer.hidden { opacity:0; transform:translate(-50%,-30px); }
  #chat { position:absolute; bottom:5%; left:3%; display:flex; flex-direction:column; align-items:stretch;
    gap:8px; width:min(660px,70vw); }
  #viewers { position:absolute; top:3%; left:3%; font-size:19px; font-weight:650;
    color:var(--cyan); text-shadow:0 2px 5px #000a; }
  .chat-line { width:100%; min-width:0; background:#08152bdc; border-left:4px solid var(--cyan);
    border-radius:6px 12px 12px 6px; padding:9px 14px; font-size:clamp(17px,1.5vw,29px);
    box-shadow:0 4px 28px #0008; overflow-wrap:anywhere; animation:chatIn .28s both; }
  .chat-line .who { color:var(--cyan); font-weight:850; margin-right:10px; }
  .platform-mark { display:inline-flex; align-items:center; vertical-align:middle; margin-right:6px; }
  .platform-mark svg { display:block; width:19px; height:19px; }
  .viewer-mark { display:inline-flex; gap:4px; align-items:center; margin-right:12px; }
  .chat-line .badge { color:#97a8c7; font-size:.7em; font-weight:700; margin-right:8px; }
  .chat-line.leave { animation:chatOut .4s both; }
  @keyframes chatIn { from { opacity:0; transform:translateX(-28px); } }
  @keyframes chatOut { to { opacity:0; transform:translateX(-28px); } }
  #frame { display:none; position:absolute; inset:2%; border:8px solid #64ddff;
    border-radius:24px; box-shadow:0 0 20px #5ccaffbb,inset 0 0 18px #5ccaff44; }
  body[data-layer="frame"] #frame { display:block; }
  body[data-layer="frame"] #surface,body[data-layer="frame"] #chat,
  body[data-layer="frame"] #timer,body[data-layer="frame"] #viewers { display:none !important; }
  body[data-layer="chat"] #surface,body[data-layer="chat"] #timer,
  body[data-layer="chat"] #viewers { display:none !important; }
  body[data-layer="effects"] #chat,body[data-layer="effects"] #timer,
  body[data-layer="effects"] #viewers { display:none !important; }
  body[data-layer="alerts"] #chat,body[data-layer="alerts"] #timer,
  body[data-layer="alerts"] #viewers { display:none !important; }
  body[data-layer="timer"] #surface,body[data-layer="timer"] #chat,
  body[data-layer="timer"] #viewers { display:none !important; }
  body[data-layer="viewers"] #surface,body[data-layer="viewers"] #chat,
  body[data-layer="viewers"] #timer { display:none !important; }
  body[data-layer="timer"] #timer { top:8px; left:8px; transform:none; font-size:64px; }
  body[data-layer="timer"] #timer.hidden { transform:translateY(-20px); }
  body[data-layer="viewers"] #viewers { top:12px; left:12px; }
  body[data-layer="chat"] #chat { top:auto;bottom:5px;left:5px;right:auto;
    transform:none;width:calc(100% - 10px);height:calc(100% - 10px);justify-content:flex-end; }
  body[data-preset="compact"] .chat-line { box-shadow:none; border-radius:2px; }
  body[data-preset="glass"] .chat-line { backdrop-filter:blur(12px); border:1px solid #ffffff3a; }
  body[data-preset="neon"] .chat-line { border-left-width:5px;box-shadow:0 0 18px #6be4ef5e; }
  body[data-preset="minimal"] .chat-line { border:0;box-shadow:none; }
  body[data-preset="gold"] #frame { border-color:#fbd37a;box-shadow:0 0 22px #f8bc5c99,inset 0 0 18px #fff1a155; }
  body[data-preset="round"] #frame { border-radius:80px;border-width:12px; }
  body[data-preset="minimal"] #frame { border-width:3px;border-radius:0;box-shadow:none; }
  body[data-preset="neon"] #frame { border-color:#b66fff;box-shadow:0 0 30px #975aff,inset 0 0 22px #975aff; }
  body[data-layer="alerts"] .effect.alert { left:50%;right:auto;top:50%;transform:translate(-50%,-50%); }
</style>
</head>
<body data-position="top-right">
<div id="surface"></div>
<div id="timer" class="hidden" aria-label="Таймер">00:00</div>
<div id="chat"></div>
<div id="viewers"></div>
<div id="frame" aria-label="Рамка камеры"></div>
<script>
(() => {
  'use strict';
  const layer = new URLSearchParams(location.search).get('layer') || 'all';
  document.body.dataset.layer = layer;
  // Appearance is stored on the OBS source, independently of other XINKX layers.
  const sourceOptions = new URLSearchParams(location.search);
  // OBS's browser viewport is supersampled, while CSS layout keeps the
  // original logical scene size. GPU rendering scales this back losslessly.
  const renderPixelRatio = Number(sourceOptions.get('renderPixelRatio'));
  if (Number.isInteger(renderPixelRatio) && renderPixelRatio > 1 && renderPixelRatio <= 4) {
    document.body.style.width = `${100 / renderPixelRatio}%`;
    document.body.style.height = `${100 / renderPixelRatio}%`;
    document.body.style.transformOrigin = 'top left';
    document.body.style.transform = `scale(${renderPixelRatio})`;
  }
  const selectedPreset = sourceOptions.get('preset') || 'default';
  if (['compact','glass','neon','minimal','gold','round'].includes(selectedPreset))
    document.body.dataset.preset = selectedPreset;
  const selectedReaction = sourceOptions.get('reaction') || 'all';
  const customCaption = String(sourceOptions.get('customText') || '').slice(0,64);
  const accent = sourceOptions.get('accent') || '';
  if (/^#[0-9a-fA-F]{6}$/.test(accent))
    document.documentElement.style.setProperty('--cyan', accent);
  const opacity = Number(sourceOptions.get('opacity'));
  if (sourceOptions.has('opacity') && Number.isFinite(opacity))
    document.body.style.opacity = String(Math.max(0, Math.min(100, opacity)) / 100);
  const sourceScale = Number(sourceOptions.get('scale'));
  if (sourceOptions.has('scale') && Number.isFinite(sourceScale))
    document.documentElement.style.setProperty('--source-scale', Math.max(25, Math.min(200, sourceScale)) / 100);
  const sourceColor = (name, property) => {
    const value = sourceOptions.get(name) || '';
    if (/^#[0-9a-fA-F]{6}$/.test(value)) document.documentElement.style.setProperty(property, value);
    return /^#[0-9a-fA-F]{6}$/.test(value) ? value : '';
  };
  const customBackground=sourceColor('background','--source-background');
  const customText=sourceColor('text','--source-text');
  const chatColor=(key) => {
    const value=sourceOptions.get(key) || '';
    return /^#[0-9a-fA-F]{8}$/.test(value) ? value : '';
  };
  const messageColor=chatColor('messageColor');
  const panelColor=chatColor('panelColor');
  if (customText) document.body.style.color=customText;
  const fontSize=Number(sourceOptions.get('fontSize'));
  if (sourceOptions.has('fontSize') && Number.isFinite(fontSize))
    document.documentElement.style.setProperty('--source-font-size',Math.max(10,Math.min(100,fontSize))+'px');
  const radius=Number(sourceOptions.get('radius'));
  if (sourceOptions.has('radius') && Number.isFinite(radius))
    document.documentElement.style.setProperty('--source-radius',Math.max(0,Math.min(60,radius))+'px');
  const surface = document.getElementById('surface');
  const timer = document.getElementById('timer');
  const chat = document.getElementById('chat');
  const viewers = document.getElementById('viewers');
  const queue = [], active = [];
  let paused = false, timerVisible = false, deadline = 0, remaining = 0;
  let style = {chat:{maxMessages:8,showPlatform:true},effects:{position:'random',maxConcurrent:2,
    durationMs:5000,particleMin:25,particleMax:65,scalePercent:100}};
  const palette = ['#66ebfd','#8175ff','#f4e96c','#ff7799','#76f5bb'];
  const durations = {gg:4700,boom:2700,'low-hp':4000,confetti:5500,follow:5200,sub:5200,donation:6000,raid:6000};
  const labels = {follow:'НОВЫЙ ФОЛЛОВЕР',sub:'НОВАЯ ПОДПИСКА',donation:'ДОНАТ',raid:'РЕЙД'};
  function node(tag, cls, value) {
    const result = document.createElement(tag); result.className = cls || '';
    if (value !== undefined) result.textContent = String(value).slice(0,240);
    return result;
  }
  function icon(platform) {
    const wrapper=node('span','platform-mark');
    const parts={
      twitch:['#9146ff','M3 1h19v15l-6 6h-5l-3 2v-4H3z'],
      youtube:['#ff0033','M2 4h20v16H2z'],
      kick:['#53fc18','M5 5h5v5h3V8h3V5h3v6h-3v2h3v6h-3v-3h-3v-2h-3v5H5z']
    };
    const spec=parts[String(platform||'').toLowerCase()];
    if (!spec) return wrapper;
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-label',platform);
    const path=document.createElementNS(ns,'path');path.setAttribute('d',spec[1]);path.setAttribute('fill',spec[0]);
    svg.append(path);
    if (platform==='youtube') {const play=document.createElementNS(ns,'path');
      play.setAttribute('d','M10 8v8l7-4z');play.setAttribute('fill','#fff');svg.append(play);}
    wrapper.append(svg);return wrapper;
  }
  function particles(gg) {
    const root = node('div','particles');
    const config = style.effects;
    const min=Math.max(0,Number(config.particleMin)||0),max=Math.max(min,Number(config.particleMax)||0);
    const count=Math.min(200,Math.floor(min+Math.random()*(max-min+1)));
    for (let i = 0; i < count; ++i) {
      const bit = node('span', 'particle'+(gg?' gg':''),gg?'GG':undefined);
      bit.style.left = (Math.random()*100)+'%';
      bit.style.setProperty('--fall', (2+Math.random()*3.5)+'s');
      bit.style.setProperty('--delay', (Math.random()*.8)+'s');
      bit.style.setProperty('--drift', (Math.random()*200-100)+'px');
      bit.style.setProperty('--angle', (Math.random()*270)+'deg');
      if (!gg) bit.style.background = palette[i%palette.length];
      root.append(bit);
    }
    return root;
  }
  function render(event) {
    const type = String(event.type || '');
    const card = node('div', 'effect' + (event.kind==='alert'?' alert':'') +
      (type==='low-hp'||type==='gg'||type==='confetti'?' full':''));
    const where=String(layer==='effects' && selectedReaction!=='all' ? 'center' : (style.effects.position||'random'));
    const coordinates={'top-left':[16,16],'top-right':[84,16],'center':[50,46],
      'bottom-left':[16,78],'bottom-right':[84,78]};
    const center=coordinates[where]||[15+Math.random()*70,15+Math.random()*70];
    if (!card.classList.contains('full')) {card.style.left=center[0]+'%';card.style.top=center[1]+'%';}
    card.style.zoom=(Math.max(30,Math.min(200,Number(style.effects.scalePercent)||100))/100);
    if (event.kind==='alert' && labels[type]) {
      const alert = node('div','alert-card');
      alert.append(node('div','kind',labels[type]));
      alert.append(node('div','name',event.name||'Зритель'));
      const line = [event.amount,event.message].filter(Boolean).join(' · ');
      if (line) alert.append(node('div','detail',line));
      card.append(alert);
    } else if (type==='boom') card.append(node('div','impact boom',customCaption||'BOOM!'));
    else if (type==='low-hp') {
      const vignette=node('div','vignette'); vignette.append(node('strong','',customCaption||'LOW HP'));
      card.append(vignette);
    } else if (/^custom-[a-z0-9]{8}$/.test(type)) {
      const text=node('div','impact',customCaption||'МОЯ РЕАКЦИЯ');
      text.style.fontSize='clamp(40px,8vw,150px)';
      card.append(text);
    } else if (type==='gg'||type==='confetti') {
      card.append(particles(type==='gg'));
      if (customCaption) {const caption=node('div','impact',customCaption);caption.style.position='absolute';
        caption.style.left='50%';caption.style.top='35%';caption.style.transform='translateX(-50%)';card.append(caption);}
    }
    else return;
    surface.append(card);
    const task = {card,timeout:null}; active.push(task);
    const finish=() => {
      card.classList.add('leave');
      setTimeout(() => {card.remove(); const i=active.indexOf(task);if(i>=0)active.splice(i,1);drain();},350);
    };
    const duration=event.durationMs===0?0:(Number.isFinite(Number(event.durationMs))?
      Number(event.durationMs):Number(style.effects.durationMs));
    if (duration>0) task.timeout=setTimeout(finish,Math.min(60000,Math.max(200,duration)));
  }
  function drain() {
    if (paused || style.effects.enabled===false) return;
    const limit=Number(style.effects.maxConcurrent)||2;
    while (queue.length) {
      if (active.length>=limit) {
        if (active[0].timeout) break;
        const old=active.shift();old.card.remove();
      }
      render(queue.shift());
    }
  }
  function effect(event) {
    if (!event || paused || (!durations[event.type] && !/^custom-[a-z0-9]{8}$/.test(event.type))) return;
    if (layer==='alerts' && event.kind!=='alert') return;
    if (layer==='effects' && event.kind!=='reaction') return;
    if (layer==='effects' && selectedReaction!=='all' && event.type!==selectedReaction) return;
    if (['chat','timer','viewers','frame'].includes(layer)) return;
    if (queue.length>=20) queue.shift();
    queue.push(event); drain();
  }
  function showChat(event) {
    if (!['chat','all'].includes(layer)) return;
    if (!event || paused || !event.message) return;
    const line=node('div','chat-line');
    if (style.chat.showPlatform) line.append(icon(event.platform));
    line.append(node('span','who',event.name||'Зритель'));
    if (style.chat.showTime) line.append(node('span','badge',new Date().toLocaleTimeString()));
    line.append(node('span','message',event.message));
    updateLine(line);
    chat.append(line);
    while (chat.children.length>(Number(style.chat.maxMessages)||8)) chat.firstChild.remove();
    const timeout=Number(style.chat.messageDurationMs);
    if (timeout>0) setTimeout(() => {line.classList.add('leave');setTimeout(()=>line.remove(),400);},timeout);
  }
  function applyAppearance(profile) {
    if (!profile||typeof profile!=='object') return;
    style=profile;
    const c=profile.chat||{};
    chat.style.fontFamily=JSON.stringify(String(c.font||'Segoe UI'))+',sans-serif';
    chat.style.width=(Number(c.widthPercent)||60)+'%';
    chat.style.gap=(Number(c.gap)||0)+'px';
    chat.style.left=c.horizontal==='left'?'3%':c.horizontal==='right'?'auto':'50%';
    chat.style.right=c.horizontal==='right'?'3%':'auto';
    chat.style.top=c.vertical==='top'?'5%':c.vertical==='center'?'50%':'auto';
    chat.style.bottom=c.vertical==='bottom'?'5%':'auto';
    chat.style.transform=(c.horizontal==='center'?'translateX(-50%)':'')+
      (c.vertical==='center'?' translateY(-50%)':'');
    chat.style.alignItems='stretch';
    chat.style.background=panelColor || String(c.panelColor||'#09152c')+
      Math.round(Math.max(0,Math.min(100,Number(c.panelOpacity??0)))*2.55).toString(16).padStart(2,'0');
    chat.style.borderRadius=(Number(c.radius)||0)+'px';
    chat.style.padding=(Number(c.panelPadding??0))+'px';
    if (layer==='chat') {
      chat.style.left='5px';chat.style.right='auto';chat.style.top='auto';chat.style.bottom='5px';
      chat.style.width='calc(100% - 10px)';chat.style.height='calc(100% - 10px)';chat.style.transform='none';
      chat.style.justifyContent=c.vertical==='top'?'flex-start':c.vertical==='center'?'center':'flex-end';
    }
    for (const line of chat.children) updateLine(line);
  }
  function updateLine(line) {
    const c=style.chat||{};
    line.style.background=messageColor || customBackground || String(c.backgroundColor||'#09152c')+
      Math.round(Math.max(0,Math.min(100,Number(c.opacity??88)))*2.55).toString(16).padStart(2,'0');
    if (selectedPreset==='minimal' && !messageColor && !customBackground) line.style.background='transparent';
    line.style.color=customText || String(c.textColor||'#f6faff');
    line.style.padding=(Number(c.padding)||0)+'px';
    line.style.borderRadius=sourceOptions.has('radius') ? Math.max(0,Math.min(60,radius))+'px' : (Number(c.radius)||0)+'px';
    line.style.fontSize=sourceOptions.has('fontSize') ? Math.max(10,Math.min(100,fontSize))+'px' : (Number(c.fontSize)||26)+'px';
    line.style.fontWeight=String(Number(c.fontWeight)||600);
    const who=line.querySelector('.who');if(who)who.style.color=String(c.nameColor||'#8de9fb');
  }
  function clock() {
    const seconds=Math.max(0,Math.ceil((deadline>0 ? deadline-Date.now() : remaining*1000)/1000));
    timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    const visible = timerVisible && seconds>0;
    timer.classList.toggle('hidden',!visible);
  }
  function state(value) {
    if (value.presentation&&value.presentation.viewer) applyAppearance(value.presentation.viewer);
    const counts=value.viewers||{};
    viewers.replaceChildren();
    if (style.chat.showViewers) for (const [platform,count] of Object.entries(counts)) {
      const item=node('span','viewer-mark');
      item.append(icon(platform),node('span','',count));viewers.append(item);
    }
    paused=Boolean(value.paused);
    const where=String(value.position||'top-right');
    document.body.dataset.position=['top-right','top-left','center'].includes(where)?where:'top-right';
    if (paused) { queue.length=0;for (const task of active.splice(0)) {clearTimeout(task.timeout);task.card.remove();} }
    timerVisible=Boolean(value.visible);
    remaining=Number(value.remaining)||0;
    deadline=Number(value.deadline)||0;
    clock();
  }
  const source=new EventSource('/events');
  source.addEventListener('state',e=>{try{state(JSON.parse(e.data));}catch{}});
  source.addEventListener('effect',e=>{try{effect(JSON.parse(e.data));}catch{}});
  source.addEventListener('chat',e=>{try{showChat(JSON.parse(e.data));}catch{}});
  source.addEventListener('clear',()=>{queue.length=0;for(const task of active.splice(0)){
    clearTimeout(task.timeout);task.card.remove();}});
  setInterval(clock,250);
})();
</script>
</body>
</html>
